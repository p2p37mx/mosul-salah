name: Recover Keystore
on: workflow_dispatch
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode --ignore-garbage > release.keystore
          echo "${{ secrets.SIGNING_PASSWORD }}" > password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: |
            release.keystore
            password.txt
          retention-days: 1
